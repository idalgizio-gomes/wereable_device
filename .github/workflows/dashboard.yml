name: Dashboard tests

# Sem framework de testes JS instalado (sem package.json/node_modules neste repositório) — a
# verificação replica o método manual já usado nas sessões interativas: sintaxe real via
# `node --check` + checagem de funções/ids HTML duplicados.
#
# Corrigido (2026-09-17): a versão anterior extraía um <script> inline único de index.html —
# ficou obsoleta quando o dashboard foi modularizado em ~27 ficheiros <script src="...">
# (nenhum <script> inline restou), pelo que a extração deixou de encontrar correspondência e
# o job parava de validar sintaxe real. Agora itera sobre cada <script src> local declarado em
# index.html.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar sintaxe de cada <script src> local de index.html
        working-directory: web/dashboard
        run: |
          node -e "
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf-8');
          const files = [...html.matchAll(/<script src=\"([^\"]+)\"/g)]
            .map(m => m[1])
            .filter(src => !/^https?:/.test(src));
          if (!files.length) { console.error('Nao encontrei nenhum <script src=...> local em index.html'); process.exit(1); }
          console.log(files.length + ' ficheiros a validar:', files.join(', '));
          let failed = false;
          for (const f of files) {
            try {
              execFileSync('node', ['--check', f], { stdio: 'inherit' });
            } catch (e) {
              console.error('Falhou:', f);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          "

      - name: Verificar funções/ids duplicados
        working-directory: web/dashboard
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf-8');
          const files = [...html.matchAll(/<script src=\"([^\"]+)\"/g)]
            .map(m => m[1])
            .filter(src => !/^https?:/.test(src));
          const combined = files.map(f => fs.readFileSync(f, 'utf-8')).join('\n');

          const funcMatches = [...combined.matchAll(/^function (\w+)/gm)].map(m => m[1]);
          const funcCounts = {};
          funcMatches.forEach(f => funcCounts[f] = (funcCounts[f] || 0) + 1);
          const dupFuncs = Object.entries(funcCounts).filter(([,n]) => n > 1).map(([f]) => f);

          const idMatches = [...html.matchAll(/id=\"([^\"]+)\"/g)].map(m => m[1]);
          const idCounts = {};
          idMatches.forEach(i => idCounts[i] = (idCounts[i] || 0) + 1);
          const dupIds = Object.entries(idCounts).filter(([,n]) => n > 1).map(([i]) => i);

          if (dupFuncs.length || dupIds.length) {
            console.error('Funcoes duplicadas:', dupFuncs);
            console.error('IDs duplicados:', dupIds);
            process.exit(1);
          }
          console.log('Sem funcoes ou ids duplicados em ' + files.length + ' ficheiros.');
          "
