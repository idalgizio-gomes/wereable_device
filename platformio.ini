; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed-xiao-afruitnrf52-nrf52840-sense-plus]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense-plus
framework = arduino

; Velocidade monitor serial
monitor_speed = 115200

; Bibliotecas necessárias
lib_deps =
    seeed-studio/Seeed Arduino LSM6DS3
	sparkfun/SparkFun u-blox GNSS Arduino Library
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/Adafruit SSD1351 library
    adafruit/Adafruit GFX Library
	jgromes/RadioLib
    rweather/Crypto
    adafruit/Adafruit SPIFlash



; Configuração I2C (fix para Xiao)
build_flags =
    -DARDUINO_ARCH_NRF52
    -DUSE_TINYUSB
    ;-DPIN_WIRE_SDA=4
    ;-DPIN_WIRE_SCL=5

; Upload settings
upload_protocol = nrfutil

; BUG CORRIGIDO (2026-07-03): sem isto, o ambiente principal também
; compilava src/test_lora_isolated.cpp (que tem o seu próprio
; setup()/loop()), causando "multiple definition of setup/loop" e
; falha total do build principal — confirmado no primeiro build a
; seguir a adicionar o ambiente de teste isolado abaixo.
;
; BUG CORRIGIDO (2026-08-06): mesmo problema, desta vez com
; src/main_no_comments.cpp (cópia de referência de main.cpp sem
; comentários, criada em 2026-08-04 para o pedido de documentação por
; temas — ver DOCUMENTACAO_TECNICA_CODIGO.md — nunca destinada a ser
; compilada). Ficou por excluir daqui, e o build principal falhava com
; "multiple definition of setup/loop" e mais ~20 funções (confirmado por
; build real, `pio run`, 2026-08-06) — o mesmo risco já tinha sido
; sinalizado antes sem resposta, e é a causa direta de o upload nunca
; ter aparecido disponível. O ficheiro fica no disco (é só uma cópia de
; referência), só passa a ser excluído do build por omissão.
build_src_filter = +<*> -<test_lora_isolated.cpp> -<main_no_comments.cpp>

; ------------------------------------------------------------
; Ambiente de teste isolado do LoRa (2026-07-03, pedido do utilizador:
; "testar cada parâmetro individualmente antes do código completo").
; Compila SÓ src/test_lora_isolated.cpp (exclui main.cpp e todos os
; outros módulos do firmware principal — build_src_filter garante que
; não há dois setup()/loop() a competir). Uso:
;   pio run -e test_lora_isolated -t upload
; ------------------------------------------------------------
[env:test_lora_isolated]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense-plus
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_lora_isolated.cpp>
build_flags =
    -DARDUINO_ARCH_NRF52
    -DUSE_TINYUSB
upload_protocol = nrfutil

; ------------------------------------------------------------
; Ambiente de teste isolado do GNSS (2026-07-31, escrito sem placa
; disponível — ver test/GNSS.cpp). Mesmo padrão do test_lora_isolated
; acima: compila SÓ test/GNSS.cpp (build_src_filter exclui src/ por
; completo e inclui só o ficheiro de teste, para não haver dois
; setup()/loop() a competir). Uso:
;   pio run -e test_gnss_isolated -t upload
; ------------------------------------------------------------
[env:test_gnss_isolated]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense-plus
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun u-blox GNSS Arduino Library
build_src_filter = -<*> +<../test/GNSS.cpp>
build_flags =
    -DARDUINO_ARCH_NRF52
    -DUSE_TINYUSB
upload_protocol = nrfutil
